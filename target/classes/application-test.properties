# Test Configuration
spring.application.name=lab-management-system-test
server.port=8081
server.servlet.context-path=/

# Test Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DATABASE_TO_UPPER=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test Logging
logging.level.root=INFO
logging.level.com.lab.management=DEBUG

# JPA/Hibernate for Testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# Test Properties
api.base.url=http://localhost:8081
equipment.default.ip=192.168.1.100
equipment.default.port=8888

# VIOLATION: Software Portability - Windows paths
lab.data.path=C:\\lab\\test\\data\\
lab.backup.path=C:\\lab\\test\\backup\\
lab.reports.path=C:\\lab\\test\\reports\\
