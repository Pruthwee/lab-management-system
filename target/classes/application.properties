# VIOLATION: Cloud Compatibility - Hardcoded application name and port
spring.application.name=lab-management-system
server.port=8080
server.servlet.context-path=/

# VIOLATION: Cloud Compatibility - Hardcoded database configuration
# Should use environment variables or cloud-native configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DATABASE_TO_UPPER=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# VIOLATION: Database Dependency - Oracle compatibility mode for H2
# Tight coupling to Oracle-specific features
spring.h2.console.enabled=true
spring.datasource.platform=h2

# VIOLATION: Code Sustainability - No connection pool optimization
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.connectionTimeout=20000

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# VIOLATION: Code Sustainability - Lazy loading could cause N+1 issues
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# VIOLATION: Cloud Compatibility - Hardcoded server configuration
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=always
server.error.include-stacktrace=on_param

# Logging configuration
logging.level.root=INFO
logging.level.com.lab.management=DEBUG
logging.file.name=logs/app.log
logging.file.max-size=10MB

# VIOLATION: Software Portability - Windows-specific log path
logging.file.path=C:\\logs\\lab-management\\

# VIOLATION: Cloud Compatibility - Hardcoded API URLs
api.base.url=http://localhost:8080
api.version=1.0.0

# VIOLATION: Software Portability - Windows paths
lab.data.path=C:\\lab\\data\\
lab.backup.path=C:\\lab\\backup\\
lab.reports.path=C:\\lab\\reports\\

# Equipment configuration with hardcoded IPs
equipment.default.ip=192.168.1.100
equipment.default.port=8888
equipment.timeout.seconds=30

# Database backup configuration
backup.enabled=true
backup.schedule=0 0 2 * * ?
backup.location=C:\\backups\\lab\\
