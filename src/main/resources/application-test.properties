# Test Configuration
spring.application.name=lab-management-system-test
server.port=8081
server.servlet.context-path=/

# Test Database
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Test Logging
logging.level.root=INFO
logging.level.com.lab.management=DEBUG

# JPA/Hibernate for Testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# Test Properties
api.base.url=${API_BASE_URL:http://localhost:8081}
equipment.default.ip=${EQUIPMENT_IP:192.168.1.100}
equipment.default.port=${EQUIPMENT_PORT:8888}

# VIOLATION: Software Portability - Windows paths
lab.data.path=${DATA_PATH:/app/test/data/}
lab.backup.path=${BACKUP_PATH:/app/test/backup/}
lab.reports.path=${REPORTS_PATH:/app/test/reports/}
