# Development Configuration
# VIOLATION: Code Sustainability - Duplicate configuration

spring.application.name=lab-management-system-dev
server.port=8080
server.servlet.context-path=/

# Development Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DATABASE_TO_UPPER=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Development Logging
logging.level.root=INFO
logging.level.com.lab.management=DEBUG
logging.level.org.springframework.web=DEBUG

# Development Properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# VIOLATION: Cloud Compatibility - Hardcoded development URLs
api.base.url=http://localhost:8080
equipment.default.ip=192.168.1.100
equipment.default.port=8888

# VIOLATION: Software Portability - Windows paths
lab.data.path=C:\\lab\\data\\
lab.backup.path=C:\\lab\\backup\\
lab.reports.path=C:\\lab\\reports\\
