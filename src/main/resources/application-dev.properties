# Development Configuration
# VIOLATION: Code Sustainability - Duplicate configuration

spring.application.name=lab-management-system-dev
server.port=8080
server.servlet.context-path=/

# Development Database
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Development Logging
logging.level.root=INFO
logging.level.com.lab.management=DEBUG
logging.level.org.springframework.web=DEBUG

# Development Properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# VIOLATION: Cloud Compatibility - Hardcoded development URLs
api.base.url=${API_BASE_URL:http://localhost:8080}
equipment.default.ip=${EQUIPMENT_IP:192.168.1.100}
equipment.default.port=${EQUIPMENT_PORT:8888}

# VIOLATION: Software Portability - Windows paths
lab.data.path=${DATA_PATH:/app/data/}
lab.backup.path=${BACKUP_PATH:/app/backup/}
lab.reports.path=${REPORTS_PATH:/app/reports/}
