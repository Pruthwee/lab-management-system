# Production Configuration
# VIOLATION: Cloud Compatibility - Still has hardcoded values, should use environment variables

spring.application.name=lab-management-system-prod
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Production Database (VIOLATION: Should be fully externalized)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Connection Pool Optimization
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.connectionTimeout=30000

# Production Logging
logging.level.root=WARN
logging.level.com.lab.management=INFO
logging.file.name=logs/lab-management-system.log
logging.file.max-size=10MB
logging.file.max-history=10

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# VIOLATION: Cloud Compatibility - Hardcoded production URLs
api.base.url=${API_BASE_URL:http://localhost:8080}
equipment.default.ip=${EQUIPMENT_IP:192.168.1.100}
equipment.default.port=${EQUIPMENT_PORT:8888}

# VIOLATION: Software Portability - Windows paths (should be externalized)
lab.data.path=${DATA_PATH:/app/data/}
lab.backup.path=${BACKUP_PATH:/app/backup/}
lab.reports.path=${REPORTS_PATH:/app/reports/}

# Backup Configuration
backup.enabled=true
backup.schedule=0 0 2 * * ?
backup.location=${BACKUP_PATH:/app/backup/}
