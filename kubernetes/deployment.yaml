apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-management-system
  namespace: lab-management-system
  labels:
    app: lab-management-system
    version: "1.0.0"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-management-system
  template:
    metadata:
      labels:
        app: lab-management-system
        version: "1.0.0"
    spec:
      containers:
        - name: lab-management-system
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx512m -Djava.security.egd=file:/dev/./urandom"
            # Database configuration
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: DB_USERNAME
              value: "{{DB_USERNAME}}"
            - name: DB_PASSWORD
              value: "{{DB_PASSWORD}}"
            - name: DB_URL
              value: "{{DB_URL}}"
            # Application configuration
            - name: SERVER_PORT
              value: "8080"
            - name: API_BASE_URL
              value: "{{API_BASE_URL}}"
            # Storage paths
            - name: LAB_DATA_PATH
              value: "/app/data"
            - name: LAB_BACKUP_PATH
              value: "/app/backup"
            - name: LAB_REPORTS_PATH
              value: "/app/reports"
            # Equipment configuration
            - name: EQUIPMENT_DEFAULT_IP
              value: "{{EQUIPMENT_DEFAULT_IP}}"
            - name: EQUIPMENT_DEFAULT_PORT
              value: "{{EQUIPMENT_DEFAULT_PORT}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: lab-data
              mountPath: /app/data
            - name: lab-reports
              mountPath: /app/reports
            - name: lab-logs
              mountPath: /app/logs
      volumes:
        - name: lab-data
          emptyDir: {}
        - name: lab-reports
          emptyDir: {}
        - name: lab-logs
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
